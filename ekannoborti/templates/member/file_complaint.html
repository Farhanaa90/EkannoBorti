{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-xl">

    <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-bold text-purple-800">File a Complaint</h2>
    </div>

    <div class="bg-white rounded-xl shadow-sm p-6 border border-purple-100">

        <div class="bg-purple-50 border border-purple-200 rounded-xl px-4 py-3 mb-5 text-sm text-purple-700">
            Your complaint will be sent directly to the Mess Manager. You can choose to remain anonymous.
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-4">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Your Complaint</label>
                <textarea name="complaint_text" rows="5" required
                          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-400 outline-none text-sm"
                          placeholder="Write your complaint here..."></textarea>
            </div>

            <div class="mb-6">
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" name="is_anonymous" checked
                           class="w-4 h-4 accent-purple-600">
                    <span class="text-sm text-gray-700">
                        Submit anonymously
                        <span class="text-gray-400">(your name will be hidden from manager)</span>
                    </span>
                </label>
            </div>

            <button type="submit"
                    class="w-full bg-purple-700 hover:bg-purple-800 text-white py-3 rounded-xl font-semibold transition">
                Submit Complaint
            </button>
        </form>
    </div>

</div>
{% endblock %}
