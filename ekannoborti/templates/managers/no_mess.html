{% extends 'base.html' %}
{% block title %}No Mess Found{% endblock %}

{% block content %}
<div class="min-h-screen bg-purple-50 flex items-center justify-center px-4 py-16">
    <div class="bg-white rounded-2xl border border-purple-100 shadow-sm p-10 text-center max-w-md w-full">

        <div class="w-20 h-20 rounded-full bg-purple-100 flex items-center justify-center mx-auto mb-6">
            <svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="6" y="10" width="26" height="20" rx="4" stroke="#7C3AED" stroke-width="2" />
                <path d="M13 10V8a6 6 0 0 1 12 0v2" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" />
                <circle cx="19" cy="21" r="3" fill="#C4B5FD" />
                <path d="M19 24v3" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" />
            </svg>
        </div>

        <h2 class="text-xl font-bold text-purple-900 mb-2">No mess found yet!</h2>
        <p class="text-gray-400 text-sm mb-8 leading-relaxed">
            You haven't been assigned to a mess yet.<br>
            Create yours to get started.
        </p>

        <a href="{% url 'create_mess' %}"
            class="inline-flex items-center gap-2 bg-purple-700 hover:bg-purple-800 text-white font-semibold text-sm px-7 py-3 rounded-full transition-all duration-200 shadow-md hover:shadow-lg hover:-translate-y-0.5">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            Create Mess
        </a>

    </div>
</div>
{% endblock %}
